# Poller for time-sensitive outbound crons that don't fit in Vercel Hobby's
# 2-cron limit (auto-discover + run-daily-outbound already use both slots).
#
#   run-due    — sends AI conversation replies scheduled with 2-15 min jitter;
#                without a frequent poller they'd sit until the next daily cron.
#   follow-ups — daily nudge pass over stale AI conversations.
#
# GitHub Actions schedule granularity is ~5 min best-effort, which is fine:
# reply jitter is 2-15 min by design, so worst case a reply lands a few
# minutes late and still reads human.
name: outbound-cron

on:
  schedule:
    - cron: "*/5 * * * *"    # drain due AI replies
    - cron: "30 9 * * 1-5"   # weekday follow-ups pass
  workflow_dispatch: {}

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      # The secret travels as a bearer token, not in the query string, so it
      # cannot end up in an access log, a proxy or a referrer.
      - name: Drain due AI replies
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://linkable-ops.vercel.app/api/cron/run-due"
      - name: Follow-ups (weekday morning schedule only)
        if: github.event.schedule == '30 9 * * 1-5'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sf --max-time 55 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://linkable-ops.vercel.app/api/cron/follow-ups"
